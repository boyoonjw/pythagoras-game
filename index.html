<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>피타고라스 땅따먹기</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="board" id="board"></header>
<div class="play">
  <div class="gridwrap"><svg id="grid" viewBox="-0.7 -0.7 17.4 17.4"></svg></div>
  <div class="side">
    <main id="main"></main>
    <footer>
      <button class="main" onclick="openMission()">미션 뽑기</button>
      <button onclick="openExchange()">교환소</button>
      <button onclick="openPlace()">땅 놓기</button>
      <button onclick="openNextTurn()">다음 차례</button>
    </footer>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
